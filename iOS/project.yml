# The iPhone app. Generate the Xcode project with `xcodegen` in this folder,
# or let Scripts/install-iphone.sh do it for you.
name: WordReader
options:
  bundleIdPrefix: com.ssharples
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WordReaderKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WordReader:
    type: application
    platform: iOS
    sources:
      - path: WordReader
    dependencies:
      - package: WordReaderKit
        product: ReaderKit
    settings:
      base:
        PRODUCT_NAME: Word Reader
        PRODUCT_BUNDLE_IDENTIFIER: $(WORD_READER_BUNDLE_ID)
        WORD_READER_BUNDLE_ID: com.ssharples.WordReader
        INFOPLIST_FILE: WordReader/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  WordReader:
    build:
      targets:
        WordReader: all
    run:
      config: Debug
